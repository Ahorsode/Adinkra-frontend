<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0f2a55">
  <title>Adinkra Airways</title>
  <link rel="icon" href="/img/mark.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/css/app.css">
  <script type="module" src="/js/main.js"></script>
</head>
<body>
  <a class="skip" href="#app">Skip to content</a>
  <header class="topbar">
    <div class="wrap topbar-inner">
      <a class="brand" href="#/" aria-label="Adinkra Airways home">
        <img src="/img/mark.svg" alt="" width="30" height="30">
        <span>Adinkra <b>Airways</b></span>
      </a>
      <button class="nav-toggle" aria-expanded="false" aria-controls="nav" aria-label="Menu">
        <span></span><span></span><span></span>
      </button>
      <nav id="nav" class="nav"></nav>
    </div>
  </header>
  <main id="app" class="wrap" tabindex="-1"></main>
  <footer class="footer">
    <div class="wrap footer-inner">
      <div>
        <strong>Adinkra Airways</strong><br>
        Kotoka International Airport, Accra · Customer care 0302 000 000
      </div>
      <div class="footer-links">
        <a href="#/schedule">Timetable</a>
        <a href="#/status">Flight status</a>
        <a href="#/cargo">Cargo</a>
        <a href="#/support" data-auth hidden>Help</a>
      </div>
      <div class="muted small">All times shown in GMT (Ghana time). Sandbox payments — no real money is charged.</div>
    </div>
  </footer>
  <div id="toasts" class="toasts" aria-live="polite"></div>
  <dialog id="modal" class="modal"></dialog>
</body>
</html>
